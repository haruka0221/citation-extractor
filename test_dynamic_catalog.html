<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Work Catalog Test Suite</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 300;
        }
        .header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
            font-size: 1.1em;
        }
        .content {
            padding: 30px;
        }
        .test-section {
            margin: 40px 0;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 5px solid #667eea;
        }
        .test-section h2 {
            margin: 0 0 20px 0;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-input {
            flex: 1;
            min-width: 300px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #218838; transform: translateY(-2px); }
        .btn-warning { background: #ffc107; color: #212529; }
        .btn-warning:hover { background: #e0a800; transform: translateY(-2px); }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; transform: translateY(-2px); }
        .btn-info { background: #17a2b8; }
        .btn-info:hover { background: #138496; transform: translateY(-2px); }
        .test-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .test-buttons .btn {
            padding: 10px 20px;
            font-size: 14px;
        }
        .results {
            margin: 25px 0;
        }
        .result-item {
            margin: 15px 0;
            padding: 20px;
            background: white;
            border-radius: 10px;
            border: 1px solid #dee2e6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .result-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .result-title {
            flex: 1;
            min-width: 200px;
        }
        .result-title h4 {
            margin: 0 0 5px 0;
            color: #2c3e50;
            font-size: 1.2em;
        }
        .result-subtitle {
            color: #6c757d;
            font-size: 0.95em;
        }
        .badges {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .confidence-high { background: #d4edda; color: #155724; }
        .confidence-medium { background: #fff3cd; color: #856404; }
        .confidence-low { background: #f8d7da; color: #721c24; }
        .match-exact { background: #d1ecf1; color: #0c5460; }
        .match-fuzzy { background: #e2e3e5; color: #383d41; }
        .text-preview {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            white-space: pre-wrap;
            margin: 15px 0;
            font-size: 14px;
            line-height: 1.6;
        }
        .metadata-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }
        .metadata-item {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
        }
        .metadata-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 3px;
        }
        .metadata-value {
            color: #6c757d;
        }
        .console-output {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin: 20px 0;
            font-size: 13px;
            line-height: 1.4;
        }
        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .loading {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .empty-state .icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Dynamic Work Catalog Test Suite</h1>
            <p>Testing pg_catalog.csv integration with fuzzy search and caching</p>
        </div>

        <div class="content">
            <!-- Catalog Status & Stats -->
            <div class="test-section">
                <h2><span>📊</span> Catalog Status & Statistics</h2>
                <div class="controls">
                    <button class="btn btn-success" onclick="initializeCatalog()">
                        <span>🚀</span> Initialize Catalog
                    </button>
                    <button class="btn btn-warning" onclick="rescanCatalog()">
                        <span>🔄</span> Rescan Files
                    </button>
                    <button class="btn btn-info" onclick="clearCache()">
                        <span>🗑️</span> Clear Cache
                    </button>
                </div>
                <div id="catalogStatus" class="status-message" style="display: none;"></div>
                <div id="catalogStats" class="stats-grid"></div>
            </div>

            <!-- Search Tests -->
            <div class="test-section">
                <h2><span>🔍</span> Search & Discovery Tests</h2>
                <div class="controls">
                    <input type="text" id="searchInput" class="search-input"
                           placeholder="Enter search term (e.g., 'paradise', 'milton', 'hamlet')"
                           value="paradise">
                    <button class="btn" onclick="searchCatalog()">
                        <span>🔍</span> Search
                    </button>
                    <button class="btn btn-warning" onclick="fuzzySearchTest()">
                        <span>🔀</span> Fuzzy Test
                    </button>
                </div>

                <div class="test-buttons">
                    <button class="btn btn-success" onclick="testSearch('paradise')">Paradise</button>
                    <button class="btn btn-success" onclick="testSearch('milton')">Milton</button>
                    <button class="btn btn-success" onclick="testSearch('hamlet')">Hamlet</button>
                    <button class="btn btn-success" onclick="testSearch('dickens')">Dickens</button>
                    <button class="btn btn-success" onclick="testSearch('emily dickinson')">Emily Dickinson</button>
                    <button class="btn btn-success" onclick="testSearch('dostoevsky')">Dostoevsky</button>
                    <button class="btn btn-info" onclick="testSearch('iliad')">Iliad</button>
                    <button class="btn btn-info" onclick="testSearch('poems')">Poems</button>
                </div>

                <div id="searchResults" class="results"></div>
            </div>

            <!-- Citation Extraction Tests -->
            <div class="test-section">
                <h2><span>📝</span> Citation Extraction with pg_catalog.csv</h2>
                <div class="controls">
                    <input type="text" id="citationInput" class="search-input"
                           placeholder="Enter citation (e.g., 'paradise lost 1-5', 'absalom and achitophel 7-9')"
                           value="absalom and achitophel 7-9">
                    <button class="btn" onclick="extractCitation()">
                        <span>📝</span> Extract
                    </button>
                </div>

                <div class="test-buttons">
                    <button class="btn btn-success" onclick="testCitation('absalom and achitophel 7-9')">Absalom 7-9</button>
                    <button class="btn btn-success" onclick="testCitation('old curiosity shop 1-5')">Dickens 1-5</button>
                    <button class="btn btn-success" onclick="testCitation('poems 10-15')">Poems 10-15</button>
                    <button class="btn btn-success" onclick="testCitation('iliad 1-3')">Iliad 1-3</button>
                    <button class="btn btn-info" onclick="testCitation('paradise')">Paradise (ambiguous)</button>
                    <button class="btn btn-info" onclick="testCitation('milton')">Milton (author)</button>
                </div>

                <div id="citationResults" class="results"></div>
            </div>

            <!-- Console Output -->
            <div class="test-section">
                <h2><span>🖥️</span> Console Output</h2>
                <div class="controls">
                    <button class="btn btn-warning" onclick="clearConsole()">
                        <span>🗑️</span> Clear Console
                    </button>
                    <button class="btn btn-info" onclick="exportResults()">
                        <span>💾</span> Export Results
                    </button>
                </div>
                <div id="consoleOutput" class="console-output">Console output will appear here...</div>
            </div>
        </div>
    </div>

    <script src="dynamic-work-catalog.js"></script>
    <script>
        let dynamicCatalog = null;
        let consoleDiv = null;

        // Intercept console.log for display
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;

        console.log = function(...args) {
            originalLog.apply(console, args);
            appendToConsole('LOG', args.join(' '));
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            appendToConsole('ERROR', args.join(' '));
        };

        console.warn = function(...args) {
            originalWarn.apply(console, args);
            appendToConsole('WARN', args.join(' '));
        };

        function appendToConsole(level, message) {
            if (consoleDiv) {
                const timestamp = new Date().toLocaleTimeString();
                const levelColor = level === 'ERROR' ? '#ff6b6b' : level === 'WARN' ? '#ffd93d' : '#74c0fc';
                consoleDiv.innerHTML += `<span style="color: ${levelColor}">[${timestamp}] ${level}:</span> ${message}\n`;
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
            }
        }

        window.addEventListener('load', () => {
            consoleDiv = document.getElementById('consoleOutput');
            console.log('🚀 Dynamic Work Catalog Test Suite loaded');
            console.log('Ready to test pg_catalog.csv integration');
        });

        async function initializeCatalog() {
            const statusDiv = document.getElementById('catalogStatus');
            const statsDiv = document.getElementById('catalogStats');

            try {
                showStatus('Initializing dynamic catalog...', 'loading');

                if (!window.DynamicWorkCatalog) {
                    throw new Error('DynamicWorkCatalog class not found');
                }

                dynamicCatalog = new window.DynamicWorkCatalog();
                await dynamicCatalog.initialize();

                showStatus('✅ Dynamic catalog initialized successfully', 'success');
                updateStats();

            } catch (error) {
                console.error('❌ Failed to initialize catalog:', error);
                showStatus(`❌ Initialization failed: ${error.message}`, 'error');
            }
        }

        async function rescanCatalog() {
            if (!dynamicCatalog) {
                showStatus('❌ Catalog not initialized', 'error');
                return;
            }

            try {
                showStatus('Rescanning for new files...', 'loading');

                const newFilesCount = await dynamicCatalog.rescanCatalog();

                if (newFilesCount > 0) {
                    showStatus(`✅ Found ${newFilesCount} new files and updated catalog`, 'success');
                } else {
                    showStatus('ℹ️ No new files found', 'warning');
                }

                updateStats();

            } catch (error) {
                console.error('❌ Rescan failed:', error);
                showStatus(`❌ Rescan failed: ${error.message}`, 'error');
            }
        }

        async function clearCache() {
            try {
                localStorage.removeItem('dynamicWorkCatalog');
                showStatus('✅ Cache cleared successfully', 'success');
                console.log('💾 Cache cleared');
            } catch (error) {
                console.error('❌ Error clearing cache:', error);
                showStatus(`❌ Failed to clear cache: ${error.message}`, 'error');
            }
        }

        function updateStats() {
            if (!dynamicCatalog) return;

            const stats = dynamicCatalog.getCatalogStats();
            const statsDiv = document.getElementById('catalogStats');

            const cacheAgeHours = Math.round(stats.cacheAge / (1000 * 60 * 60));

            statsDiv.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${stats.totalPGWorks}</div>
                    <div class="stat-label">PG Catalog Works</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.totalLocalFiles}</div>
                    <div class="stat-label">Local Files</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.totalSearchKeys}</div>
                    <div class="stat-label">Search Variants</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.averageKeysPerWork.toFixed(1)}</div>
                    <div class="stat-label">Avg Keys/Work</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${cacheAgeHours}h</div>
                    <div class="stat-label">Cache Age</div>
                </div>
            `;
        }

        async function searchCatalog() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            await testSearch(searchTerm);
        }

        async function testSearch(searchTerm) {
            if (!searchTerm) {
                showStatus('❌ Please enter a search term', 'error');
                return;
            }

            if (!dynamicCatalog || !dynamicCatalog.initialized) {
                showStatus('❌ Catalog not initialized', 'error');
                return;
            }

            try {
                console.log(`🔍 Testing search: "${searchTerm}"`);

                const results = dynamicCatalog.searchWorks(searchTerm, { maxResults: 10 });
                displaySearchResults(results, searchTerm);

            } catch (error) {
                console.error('❌ Search error:', error);
                showStatus(`❌ Search failed: ${error.message}`, 'error');
            }
        }

        async function fuzzySearchTest() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            if (!searchTerm) {
                showStatus('❌ Please enter a search term', 'error');
                return;
            }

            // Test with intentional variations
            const variations = [
                searchTerm,
                searchTerm + 's', // Add 's'
                searchTerm.slice(0, -1), // Remove last character
                searchTerm.replace(/a/g, 'e'), // Character substitution
                searchTerm.split('').reverse().join(''), // Reverse
            ];

            console.log(`🔀 Testing fuzzy search variations for: "${searchTerm}"`);

            for (const variation of variations) {
                console.log(`  Testing: "${variation}"`);
                const results = dynamicCatalog.searchWorks(variation, { maxResults: 5 });
                console.log(`    Results: ${results.length}`);
            }
        }

        async function extractCitation() {
            const citation = document.getElementById('citationInput').value.trim();
            await testCitation(citation);
        }

        async function testCitation(citation) {
            if (!citation) {
                showStatus('❌ Please enter a citation', 'error');
                return;
            }

            if (!dynamicCatalog || !dynamicCatalog.initialized) {
                showStatus('❌ Catalog not initialized', 'error');
                return;
            }

            try {
                console.log(`📝 Testing citation extraction: "${citation}"`);

                // Parse citation
                const parsed = parseCitation(citation);
                let searchTerm, lineRange;

                if (parsed) {
                    searchTerm = parsed.work;
                    lineRange = { start: parsed.startLine, end: parsed.endLine };
                    console.log(`🎯 Parsed: "${searchTerm}" lines ${lineRange.start}-${lineRange.end}`);
                } else {
                    searchTerm = citation.replace(/\d+[-\d]*/, '').trim();
                    lineRange = { start: 1, end: 5 };
                    console.log(`🔍 Fallback: "${searchTerm}" (preview)`);
                }

                // Search and extract
                const matches = dynamicCatalog.searchWorks(searchTerm, { maxResults: 5 });
                const candidates = [];

                for (const match of matches) {
                    try {
                        const text = await extractTextFromMatch(match, lineRange);
                        candidates.push({
                            ...match,
                            text: text,
                            lineRange: lineRange
                        });
                    } catch (error) {
                        console.error(`❌ Text extraction failed for ${match.filename}:`, error);
                    }
                }

                displayCitationResults(candidates, citation);

            } catch (error) {
                console.error('❌ Citation extraction error:', error);
                showStatus(`❌ Citation extraction failed: ${error.message}`, 'error');
            }
        }

        async function extractTextFromMatch(match, lineRange) {
            const response = await fetch(`./test_corpus/cleaned/${match.filename}`);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const content = await response.text();
            const lines = content.split('\n').filter(line => line.trim() !== '');

            if (!lineRange) {
                return lines.slice(0, 10).join('\n');
            }

            const { start, end } = lineRange;

            if (start < 1 || end > lines.length || start > end) {
                throw new Error(`Invalid range: ${start}-${end} (file has ${lines.length} lines)`);
            }

            return lines.slice(start - 1, end).join('\n');
        }

        function parseCitation(citation) {
            const patterns = [
                /^(.+?)\s+(\d+)-(\d+)$/,
                /^(.+?)\s+(\d+)$/,
            ];

            const cleaned = citation.toLowerCase().trim();

            for (const pattern of patterns) {
                const match = cleaned.match(pattern);
                if (match) {
                    return {
                        work: match[1].trim(),
                        startLine: parseInt(match[2]),
                        endLine: match[3] ? parseInt(match[3]) : parseInt(match[2])
                    };
                }
            }

            return null;
        }

        function displaySearchResults(results, searchTerm) {
            const container = document.getElementById('searchResults');

            if (results.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🔍</div>
                        <h3>No matches found</h3>
                        <p>No works found for "${searchTerm}"</p>
                    </div>
                `;
                return;
            }

            let html = `<h3>Search Results for "${searchTerm}" (${results.length} matches)</h3>`;

            results.forEach((result, index) => {
                const confidenceClass = getConfidenceClass(result.finalScore);
                const matchClass = result.matchType === 'exact' ? 'match-exact' : 'match-fuzzy';

                html += `
                    <div class="result-item">
                        <div class="result-header">
                            <div class="result-title">
                                <h4>${result.title}</h4>
                                <div class="result-subtitle">by ${result.author}</div>
                            </div>
                            <div class="badges">
                                <span class="badge ${confidenceClass}">${(result.finalScore * 100).toFixed(0)}%</span>
                                <span class="badge ${matchClass}">${result.matchType}</span>
                            </div>
                        </div>
                        <div class="metadata-grid">
                            <div class="metadata-item">
                                <div class="metadata-label">File</div>
                                <div class="metadata-value">${result.filename}</div>
                            </div>
                            <div class="metadata-item">
                                <div class="metadata-label">PG ID</div>
                                <div class="metadata-value">${result.pgId || 'N/A'}</div>
                            </div>
                            <div class="metadata-item">
                                <div class="metadata-label">Source</div>
                                <div class="metadata-value">${result.source}</div>
                            </div>
                            ${result.similarity ? `<div class="metadata-item">
                                <div class="metadata-label">Similarity</div>
                                <div class="metadata-value">${(result.similarity * 100).toFixed(0)}%</div>
                            </div>` : ''}
                            ${result.matchedKey ? `<div class="metadata-item">
                                <div class="metadata-label">Matched Key</div>
                                <div class="metadata-value">"${result.matchedKey}"</div>
                            </div>` : ''}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function displayCitationResults(candidates, originalCitation) {
            const container = document.getElementById('citationResults');

            if (candidates.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📝</div>
                        <h3>No candidates found</h3>
                        <p>No text extracted for "${originalCitation}"</p>
                    </div>
                `;
                return;
            }

            let html = `<h3>Citation Results for "${originalCitation}" (${candidates.length} candidates)</h3>`;

            candidates.forEach((candidate, index) => {
                const confidenceClass = getConfidenceClass(candidate.finalScore);
                const matchClass = candidate.matchType === 'exact' ? 'match-exact' : 'match-fuzzy';

                html += `
                    <div class="result-item">
                        <div class="result-header">
                            <div class="result-title">
                                <h4>${candidate.title}</h4>
                                <div class="result-subtitle">by ${candidate.author}</div>
                            </div>
                            <div class="badges">
                                <span class="badge ${confidenceClass}">${(candidate.finalScore * 100).toFixed(0)}%</span>
                                <span class="badge ${matchClass}">${candidate.matchType}</span>
                            </div>
                        </div>

                        <div class="text-preview">${candidate.text}</div>

                        <div class="metadata-grid">
                            <div class="metadata-item">
                                <div class="metadata-label">Lines</div>
                                <div class="metadata-value">${candidate.lineRange.start}-${candidate.lineRange.end}</div>
                            </div>
                            <div class="metadata-item">
                                <div class="metadata-label">File</div>
                                <div class="metadata-value">${candidate.filename}</div>
                            </div>
                            <div class="metadata-item">
                                <div class="metadata-label">PG ID</div>
                                <div class="metadata-value">${candidate.pgId || 'N/A'}</div>
                            </div>
                            <div class="metadata-item">
                                <div class="metadata-label">Source</div>
                                <div class="metadata-value">${candidate.source}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function getConfidenceClass(confidence) {
            if (confidence >= 0.8) return 'confidence-high';
            if (confidence >= 0.5) return 'confidence-medium';
            return 'confidence-low';
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('catalogStatus');
            statusDiv.className = `status-message status-${type}`;
            statusDiv.style.display = 'block';

            if (type === 'loading') {
                statusDiv.innerHTML = `<div class="loading"><div class="spinner"></div>${message}</div>`;
            } else {
                statusDiv.textContent = message;
            }

            if (type !== 'loading') {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 5000);
            }
        }

        function clearConsole() {
            document.getElementById('consoleOutput').innerHTML = 'Console cleared...\n';
        }

        function exportResults() {
            const results = {
                timestamp: new Date().toISOString(),
                catalogStats: dynamicCatalog ? dynamicCatalog.getCatalogStats() : null,
                consoleLog: document.getElementById('consoleOutput').textContent
            };

            const blob = new Blob([JSON.stringify(results, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `catalog-test-results-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);

            console.log('💾 Results exported');
        }
    </script>
</body>
</html>
